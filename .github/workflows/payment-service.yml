name: payment-service

on:
  push:
    branches:
      - main
    paths:
      - "services/payment-service/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"

permissions:
  contents: write
  packages: write

concurrency:
  group: payment-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish-and-promote:
    name: Build, publish and promote
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITOPS_PUSH_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test payment-service
        run: ./gradlew :services:payment-service:clean :services:payment-service:test :services:payment-service:bootJar --no-daemon

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/payment-service"
          image_sha_tag="${GITHUB_SHA}"

          echo "repository=${image_repository}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image_sha_tag}" >> "$GITHUB_OUTPUT"
          echo "sha_image=${image_repository}:${image_sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/payment-service
          push: true
          tags: |
            ${{ steps.image.outputs.sha_image }}
            ${{ steps.image.outputs.repository }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=payment-service

      - name: Set up yq
        uses: mikefarah/yq@v4

      - name: Commit GitOps image update
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.sha_image }}
        run: |
          set -euo pipefail

          values_file="infra/services/values.yaml"

          yq -i '.components.paymentService.image = strenv(IMAGE)' "$values_file"

          if git diff --quiet -- "$values_file"; then
            echo "GitOps values already point to ${IMAGE}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$values_file"
          git commit -m "Promote payment-service image ${GITHUB_SHA}"
          git push origin HEAD:main
