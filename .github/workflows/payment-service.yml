name: payment-service

on:
  push:
    branches:
      - main
    paths:
      - "services/payment-service/**"
      - ".github/workflows/payment-service.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"

permissions:
  contents: write
  packages: write

concurrency:
  group: payment-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish-and-promote:
    name: Build, publish and promote
    runs-on: ubuntu-latest

    steps:
      - name: Create GitOps GitHub App token
        id: gitops-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.gitops-token.outputs.token }}

      - name: Configure Git author for GitOps App
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          set -euo pipefail

          app_slug="${{ steps.gitops-token.outputs.app-slug }}"
          app_user_id="$(gh api "/users/${app_slug}[bot]" --jq .id)"

          git config user.name "${app_slug}[bot]"
          git config user.email "${app_user_id}+${app_slug}[bot]@users.noreply.github.com"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test payment-service
        run: ./gradlew :services:payment-service:clean :services:payment-service:test :services:payment-service:bootJar --no-daemon

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/payment-service"
          image_sha_tag="${GITHUB_SHA}"

          echo "repository=${image_repository}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image_sha_tag}" >> "$GITHUB_OUTPUT"
          echo "sha_image=${image_repository}:${image_sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/payment-service
          push: true
          tags: |
            ${{ steps.image.outputs.sha_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=payment-service

      - name: Set up yq
        uses: mikefarah/yq@v4

      - name: Commit GitOps image update
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          values_file="infra/services/values.yaml"

          yq -i '.components.paymentService.image = strenv(IMAGE)' "$values_file"

          if git diff --quiet -- "$values_file"; then
            echo "GitOps values already point to ${IMAGE}."
            exit 0
          fi

          git add "$values_file"
          git commit -m "Promote payment-service image ${GITHUB_SHA}"
          git push origin HEAD:main
