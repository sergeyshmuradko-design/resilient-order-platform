name: Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"

permissions:
  contents: read
  packages: write

concurrency:
  group: service-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-services:
    name: Detect services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select service build set
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          known_services=(payment-service order-service notification-service)
          selected_services=()

          add_service() {
            local candidate="$1"

            for service in "${known_services[@]}"; do
              if [[ "$service" == "$candidate" ]]; then
                for selected in "${selected_services[@]}"; do
                  [[ "$selected" == "$candidate" ]] && return 0
                done
                selected_services+=("$candidate")
                return 0
              fi
            done
          }

          add_all_services() {
            selected_services=("${known_services[@]}")
          }

          before="${{ github.event.before }}"

          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -n "$before" ]]; then
            changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
          else
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          fi

          shared_change=false

          while IFS= read -r file; do
            case "$file" in
              services/payment-service/*)
                add_service payment-service
                ;;
              services/order-service/*)
                add_service order-service
                ;;
              services/notification-service/*)
                add_service notification-service
                ;;
              build.gradle|settings.gradle|gradle/*|gradlew)
                shared_change=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$shared_change" == "true" ]]; then
            add_all_services
          fi

          if [[ "${#selected_services[@]}" -eq 0 ]]; then
            selected_services=(__none__)
          fi

          json="["
          separator=""
          for service in "${selected_services[@]}"; do
            json="${json}${separator}\"${service}\""
            separator=","
          done
          json="${json}]"

          echo "services=${json}" >> "$GITHUB_OUTPUT"
          echo "Selected services: ${json}"

  build-and-publish:
    name: Build and publish ${{ matrix.service }}
    needs: detect-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}

    steps:
      - name: Nothing to build
        if: matrix.service == '__none__'
        run: echo "No service changes detected."

      - name: Checkout repository
        if: matrix.service != '__none__'
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.service != '__none__'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test service
        if: matrix.service != '__none__'
        run: ./gradlew :services:${{ matrix.service }}:clean :services:${{ matrix.service }}:test :services:${{ matrix.service }}:bootJar --no-daemon

      - name: Prepare image metadata
        if: matrix.service != '__none__'
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}"
          image_sha_tag="${GITHUB_SHA}"

          echo "repository=${image_repository}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image_sha_tag}" >> "$GITHUB_OUTPUT"
          echo "sha_image=${image_repository}:${image_sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: matrix.service != '__none__'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: matrix.service != '__none__'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: matrix.service != '__none__'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.sha_image }}
            ${{ steps.image.outputs.repository }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.service }}
