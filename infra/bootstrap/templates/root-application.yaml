apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.root.applicationName | quote }}
  namespace: {{ .Values.namespaces.argocd | quote }}
  finalizers:
    # The finalizer lets Argo CD delete child Applications and their managed
    # resources before this root Application disappears during bootstrap
    # uninstall.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.root.projectName | quote }}
  source:
    repoURL: {{ .Values.repositoryUrl | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ .Values.root.path | quote }}
    helm:
      releaseName: {{ .Values.root.releaseName | quote }}
      parameters:
        - name: repositoryUrl
          value: {{ .Values.repositoryUrl | quote }}
        - name: targetRevision
          value: {{ .Values.targetRevision | quote }}
        - name: namespaces.platform
          value: {{ .Values.namespaces.platform | quote }}
        - name: namespaces.application
          value: {{ .Values.namespaces.application | quote }}
        - name: namespaces.externalSecrets
          value: {{ .Values.namespaces.externalSecrets | quote }}
        - name: namespaces.rabbitmqOperator
          value: {{ .Values.namespaces.rabbitmqOperator | quote }}
        - name: namespaces.nginxGateway
          value: {{ .Values.namespaces.nginxGateway | quote }}
        - name: namespaces.strimzi
          value: {{ .Values.namespaces.strimzi | quote }}
        - name: namespaces.certManager
          value: {{ .Values.namespaces.certManager | quote }}
        - name: containerImagePrefix
          value: {{ .Values.containerImagePrefix | quote }}
        - name: operators.externalSecrets.targetRevision
          value: {{ .Values.operators.externalSecrets.targetRevision | quote }}
        - name: operators.certManager.targetRevision
          value: {{ .Values.operators.certManager.targetRevision | quote }}
        - name: operators.gatewayApiCrds.targetRevision
          value: {{ .Values.operators.gatewayApiCrds.targetRevision | quote }}
        - name: operators.nginxGateway.targetRevision
          value: {{ .Values.operators.nginxGateway.targetRevision | quote }}
        - name: operators.strimzi.targetRevision
          value: {{ .Values.operators.strimzi.targetRevision | quote }}
        - name: secrets.external.storeName
          value: {{ .Values.secrets.external.storeName | quote }}
        - name: secrets.external.infisical.hostAPI
          value: {{ .Values.secrets.external.infisical.hostAPI | quote }}
        - name: secrets.external.infisical.projectSlug
          value: {{ .Values.secrets.external.infisical.projectSlug | quote }}
        - name: secrets.external.infisical.environmentSlug
          value: {{ .Values.secrets.external.infisical.environmentSlug | quote }}
        - name: secrets.external.infisical.secretsPath
          value: {{ .Values.secrets.external.infisical.secretsPath | quote }}
        - name: secrets.external.infisical.authSecretName
          value: {{ .Values.secrets.external.infisical.authSecretName | quote }}
        - name: secrets.external.infisical.authSecretNamespace
          value: {{ .Values.secrets.external.infisical.authSecretNamespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.argocd | quote }}
  syncPolicy:
    automated:
      prune: {{ .Values.sync.automated.prune }}
      selfHeal: {{ .Values.sync.automated.selfHeal }}
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
