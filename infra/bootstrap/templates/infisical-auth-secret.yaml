# Bootstrap-owned Infisical Universal Auth credentials.
#
# This Secret is intentionally created outside the Argo CD app-of-apps tree:
# root/child Applications only receive its name and namespace. That avoids
# storing the raw Client ID/Secret in Application.spec.source.helm.parameters,
# while still letting External Secrets Operator read the credentials through a
# ClusterSecretStore.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.external.infisical.authSecretName | quote }}
  namespace: {{ .Values.secrets.external.infisical.authSecretNamespace | quote }}
  labels:
    app.kubernetes.io/part-of: resilient-order-platform
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
type: Opaque
stringData:
  clientId: {{ .Values.secrets.external.infisical.clientId | quote }}
  clientSecret: {{ .Values.secrets.external.infisical.clientSecret | quote }}
