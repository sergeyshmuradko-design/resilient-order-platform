repositoryUrl: ""
targetRevision: main
containerImagePrefix: ghcr.io/sergeyshmuradko-design/resilient-order-platform

namespaces:
  argocd: argocd
  platform: resilient-orders-platform
  application: resilient-orders
  externalSecrets: external-secrets
  rabbitmqOperator: rabbitmq-system
  nginxGateway: nginx-gateway
  strimzi: strimzi-system
  certManager: cert-manager

operators:
  externalSecrets:
    enabled: true
    targetRevision: 2.8.0
  certManager:
    enabled: false
    targetRevision: 1.21.1
  rabbitmq:
    enabled: false
  gatewayApiCrds:
    enabled: true
    targetRevision: v2.6.7
  nginxGateway:
    enabled: true
    targetRevision: 2.6.7
  strimzi:
    enabled: false
    targetRevision: 1.1.0
  kyverno:
    enabled: false

childValues:
  platformSystem:
    externalSecretsEnabled: true
    kyvernoPolicyEnabled: false
  platformRuntime:
    postgresEnabled: true
    redisEnabled: true
    rabbitmqEnabled: false
  services:
    paymentServiceEnabled: false
    orderServiceEnabled: false
    notificationServiceEnabled: false
    rabbitmqTopologyEnabled: false

secrets:
  external:
    storeName: infisical-cluster-store
    infisical:
      hostAPI: https://app.infisical.com
      projectSlug: replace-me
      environmentSlug: dev
      secretsPath: /
      clientId: replace-me
      clientSecret: replace-me
      authSecretName: infisical-universal-auth
      authSecretNamespace: argocd

root:
  projectName: resilient-orders-root
  applicationName: resilient-orders-root
  releaseName: resilient-orders-root
  path: infra/root

sync:
  automated:
    prune: true
    selfHeal: true
