# Platform-system is the cluster bootstrap layer owned by platform/security
# maintainers. It creates shared namespaces, guardrails, Infisical/External
# Secrets plumbing, Gateway API entry points and contracts consumed by other
# charts.
#
# Defaults stay intentionally small because the local Codespaces cluster is used
# for a few manual checks, not for continuous production traffic.

nameOverride: ""
fullnameOverride: ""

labels:
  # Kubernetes recommended "app.kubernetes.io/part-of" value. It lets Argo CD,
  # kubectl and observability tools group every resource by the same product.
  partOf: resilient-order-platform

platform:
  serviceAccount:
    enabled: true
  config:
    enabled: true
  appContracts:
    enabled: true

namespaces:
  manage: true
  platform: resilient-orders-platform
  application: resilient-orders
  gatewayRoutesLabelKey: resilient-orders.io/gateway-routes
  gatewayRoutesLabelValue: allowed

guardrails:
  enabled: true
  quota:
    requestsCpu: 500m
    requestsMemory: 768Mi
    limitsCpu: 1500m
    limitsMemory: 1536Mi
    requestsStorage: 1Gi
    persistentVolumeClaims: "2"
    pods: "10"
  limitRange:
    defaultRequestCpu: 10m
    defaultRequestMemory: 32Mi
    defaultCpu: 150m
    defaultMemory: 192Mi
    maxCpu: 500m
    maxMemory: 512Mi

policy:
  kyverno:
    # Disabled by default to keep the small Codespaces stack light. Enable
    # together with operators.kyverno.enabled in infra/root/values.yaml when
    # you want Kubernetes admission-policy checks.
    enabled: false
    validationFailureAction: Audit

config:
  postgresDb: orders_db
  postgresUser: orders_user
  postgresExporterUser: postgres_exporter
  orderServiceDbOwnerUser: order_service_owner
  orderServiceDbUser: order_service_app
  notificationServiceDbOwnerUser: notification_service_owner
  notificationServiceDbUser: notification_service_app
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"

external:
  postgresHost: postgres

database:
  provisioner:
    enabled: false
    image: postgres:16
  # Platform-owned declaration of approved service database contracts.
  #
  # Services declare their desired schema/role names through reviewed Git
  # changes. The privileged provisioning execution stays in platform-runtime so
  # app maintainers never need administrator database credentials.
  services:
    - name: order-service
      schema: order_service
      ownerRole:
        configKey: ORDER_SERVICE_DB_OWNER_USER
        value: order_service_owner
        passwordSecretKey: ORDER_SERVICE_DB_OWNER_PASSWORD
      appRole:
        configKey: ORDER_SERVICE_DB_USER
        value: order_service_app
        passwordSecretKey: ORDER_SERVICE_DB_PASSWORD
    - name: notification-service
      schema: notification_service
      ownerRole:
        configKey: NOTIFICATION_SERVICE_DB_OWNER_USER
        value: notification_service_owner
        passwordSecretKey: NOTIFICATION_SERVICE_DB_OWNER_PASSWORD
      appRole:
        configKey: NOTIFICATION_SERVICE_DB_USER
        value: notification_service_app
        passwordSecretKey: NOTIFICATION_SERVICE_DB_PASSWORD

gateway:
  enabled: true
  name: platform-gateway
  className: nginx
  hostname: "*.localhost"
  hosts:
    argocd: argocd.localhost
  routes:
    argocd:
      enabled: true
      backendNamespace: argocd
      backendService: argo-cd-argocd-server
      backendPort: 80
  allowedRoutes:
    namespaces:
      from: Selector

secrets:
  # platform-secrets is produced by External Secrets Operator from Infisical.
  # Workloads read only the Kubernetes Secret in their own namespace; direct
  # access to Infisical stays inside the External Secrets Operator controller.
  targetName: platform-secrets
  external:
    enabled: true
    refreshInterval: 1m
    storeName: infisical-cluster-store
    operatorServiceAccount: external-secrets
    keys:
      - POSTGRES_PASSWORD
      - POSTGRES_EXPORTER_PASSWORD
      - ORDER_SERVICE_DB_OWNER_PASSWORD
      - ORDER_SERVICE_DB_PASSWORD
      - NOTIFICATION_SERVICE_DB_OWNER_PASSWORD
      - NOTIFICATION_SERVICE_DB_PASSWORD
      - JWT_SECRET
      - ORDER_SERVICE_RABBITMQ_USERNAME
      - ORDER_SERVICE_RABBITMQ_PASSWORD
      - NOTIFICATION_SERVICE_RABBITMQ_USERNAME
      - NOTIFICATION_SERVICE_RABBITMQ_PASSWORD
      - GRAFANA_ADMIN_USER
      - GRAFANA_ADMIN_PASSWORD
      - ORDER_SERVICE_ADMIN_USERNAME
      - ORDER_SERVICE_ADMIN_PASSWORD
      - ORDER_SERVICE_USER_USERNAME
      - ORDER_SERVICE_USER_PASSWORD
    infisical:
      hostAPI: https://app.infisical.com
      projectSlug: replace-me
      environmentSlug: dev
      secretsPath: /
      clientId: replace-me
      clientSecret: replace-me
      authSecretName: infisical-universal-auth
      authSecretNamespace: external-secrets

components:
  postgres:
    enabled: false
    image: postgres:16
    storage: 512Mi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  redis:
    enabled: false
    image: redis:7
    maxmemory: 32mb
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  rabbitmq:
    enabled: false
    image: rabbitmq:3-management
    storage: 512Mi
    messageTtlMs: 300000
    maxQueueLength: 1000
    diskFreeLimitBytes: "134217728"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  kafka:
    enabled: false
    # Kafka is managed by Strimzi. This keeps Kafka lifecycle, listeners,
    # KRaft metadata, broker identity and generated Services in the operator
    # instead of hand-written Deployment environment variables.
    clusterName: resilient-kafka
    nodePoolName: dual-role
    version: 4.3.0
    metadataVersion: 4.3-IV0
    replicas: 1
    storage: 512Mi
    deleteClaim: true
    heap:
      xms: 128m
      xmx: 256m
    logRetentionMs: "120000"
    logRetentionBytes: "67108864"
    logSegmentBytes: "16777216"
    resources:
      requests:
        cpu: 100m
        memory: 320Mi
      limits:
        cpu: 500m
        memory: 512Mi
  schemaRegistry:
    enabled: false
    image: confluentinc/cp-schema-registry:8.3.0
    heapOpts: -Xms64m -Xmx128m
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 300m
        memory: 256Mi


observability:
  tracing:
    enabled: false
    image: jaegertracing/all-in-one:1.60
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  monitoring:
    enabled: false
    postgresExporter:
      image: prometheuscommunity/postgres-exporter:v0.20.1
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          cpu: 100m
          memory: 128Mi
    prometheus:
      image: prom/prometheus
      retentionTime: 30m
      retentionSize: 256MB
      emptyDirSizeLimit: 256Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    grafana:
      image: grafana/grafana
      emptyDirSizeLimit: 128Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
