{{- if .Values.namespaces.manage }}
# Platform-owned namespaces.
#
# Terraform no longer creates application/runtime namespaces. The GitOps
# platform-system layer owns their labels so Gateway API route attachment and
# namespace guardrails stay visible in one Kubernetes-native place.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.platform | quote }}
  labels:
    {{ .Values.namespaces.gatewayRoutesLabelKey }}: {{ .Values.namespaces.gatewayRoutesLabelValue | quote }}
    {{- include "resilient-orders.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.application | quote }}
  labels:
    {{ .Values.namespaces.gatewayRoutesLabelKey }}: {{ .Values.namespaces.gatewayRoutesLabelValue | quote }}
    {{- include "resilient-orders.labels" . | nindent 4 }}
{{- end }}
