{{- if .Values.secrets.external.enabled }}
# Infisical-backed External Secrets source.
#
# External Secrets Operator runs in the `external-secrets` namespace. This
# ClusterSecretStore tells it how to authenticate to Infisical and which
# project/environment/path should be treated as the source of platform secrets.
#
# Universal Auth is used for Codespaces because Infisical Cloud cannot safely
# call the local k3d Kubernetes API for TokenReview. Store the Client ID/Secret
# in GitHub Actions secrets, not in Git.
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.external.infisical.authSecretName | quote }}
  namespace: {{ .Values.secrets.external.infisical.authSecretNamespace | quote }}
  labels:
    {{- include "resilient-orders.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientId: {{ .Values.secrets.external.infisical.clientId | quote }}
  clientSecret: {{ .Values.secrets.external.infisical.clientSecret | quote }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secrets.external.storeName }}
  labels:
    {{- include "resilient-orders.labels" . | nindent 4 }}
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.secrets.external.infisical.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ .Values.secrets.external.infisical.authSecretName | quote }}
            namespace: {{ .Values.secrets.external.infisical.authSecretNamespace | quote }}
            key: clientId
          clientSecret:
            name: {{ .Values.secrets.external.infisical.authSecretName | quote }}
            namespace: {{ .Values.secrets.external.infisical.authSecretNamespace | quote }}
            key: clientSecret
      secretsScope:
        projectSlug: {{ .Values.secrets.external.infisical.projectSlug | quote }}
        environmentSlug: {{ .Values.secrets.external.infisical.environmentSlug | quote }}
        secretsPath: {{ .Values.secrets.external.infisical.secretsPath | quote }}
---
# Platform namespace copy of the secrets consumed by PostgreSQL, Grafana and
# platform-owned Jobs. Each key is mapped explicitly so reviewers can see the
# exact contract between Infisical and Kubernetes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-secrets
  labels:
    {{- include "resilient-orders.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.external.storeName }}
  target:
    name: {{ .Values.secrets.targetName }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.external.keys }}
    - secretKey: {{ . | quote }}
      remoteRef:
        key: {{ . | quote }}
    {{- end }}
{{- end }}
