# Desired component state. Workflow choices keep/enable/disable update these booleans.
selection:
  enable_postgres: false
  enable_redis: false
  enable_rabbitmq_stack: false
  enable_strimzi: false
  enable_kyverno: false
  enable_payment_service: false
  enable_order_service: false
  enable_notification_service: false

repositoryUrl: ""
targetRevision: main

namespaces:
  argocd: argocd
  platform: resilient-orders-platform
  application: resilient-orders
  externalSecrets: external-secrets
  rabbitmqOperator: rabbitmq-system
  nginxGateway: nginx-gateway
  strimzi: strimzi-system
  kyverno: kyverno-system
  certManager: cert-manager

containerImagePrefix: ghcr.io/sergeyshmuradko-design/resilient-order-platform

operators:
  project: resilient-orders-platform-operators
  externalSecrets:
    enabled: true
    applicationName: resilient-orders-external-secrets
    namespace: external-secrets
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
  certManager:
    applicationName: resilient-orders-cert-manager
    namespace: cert-manager
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: 1.21.1
  rabbitmq:
    applicationName: resilient-orders-rabbitmq-operator
    namespace: rabbitmq-system
    path: infra/platform-operators/rabbitmq-operator
  gatewayApiCrds:
    enabled: true
    applicationName: resilient-orders-gateway-api-crds
    repoURL: https://github.com/nginx/nginx-gateway-fabric.git
    path: config/crd/gateway-api/standard
    targetRevision: v2.6.7
  nginxGateway:
    enabled: true
    applicationName: resilient-orders-nginx-gateway
    namespace: nginx-gateway
    repoURL: ghcr.io/nginx/charts
    chart: nginx-gateway-fabric
    targetRevision: 2.6.7
  strimzi:
    applicationName: resilient-orders-strimzi
    namespace: strimzi-system
    repoURL: quay.io/strimzi-helm
    chart: strimzi-kafka-operator
    targetRevision: 1.1.0
  kyverno:
    applicationName: resilient-orders-kyverno
    namespace: kyverno-system
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.5.2

secrets:
  external:
    storeName: infisical-cluster-store
    infisical:
      hostAPI: https://app.infisical.com
      projectSlug: replace-me
      environmentSlug: dev
      secretsPath: /
      authSecretName: infisical-universal-auth
      authSecretNamespace: argocd

sync:
  automated:
    prune: true
    selfHeal: true

layers:
  platformSystem:
    applicationName: resilient-orders-platform-system
    project: resilient-orders-platform-system
    path: infra/platform-system
  platformRuntime:
    applicationName: resilient-orders-platform-runtime
    project: resilient-orders-platform-runtime
    path: infra/platform-runtime
  services:
    applicationName: resilient-orders-services
    project: resilient-orders-services
    path: infra/services
