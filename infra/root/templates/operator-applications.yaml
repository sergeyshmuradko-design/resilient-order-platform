{{- /*
Admin-owned operator layer.

These Applications install CRDs/controllers that must exist before
platform-system, platform-runtime and services can reconcile their custom
resources. Root sync waves keep the order explicit:

-50 AppProjects
-30 operator CRDs/controllers
-20 platform-system
-10 platform-runtime
  0 services

During pruning Argo CD processes waves in reverse order, so service/runtime
resources are removed before the controllers that understand their CRDs.
*/ -}}
{{- if .Values.operators.externalSecrets.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.operators.externalSecrets.applicationName | quote }}
  namespace: {{ .Values.namespaces.argocd | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: {{ .Values.operators.project | quote }}
  source:
    repoURL: {{ .Values.operators.externalSecrets.repoURL | quote }}
    chart: {{ .Values.operators.externalSecrets.chart | quote }}
    targetRevision: {{ .Values.operators.externalSecrets.targetRevision | quote }}
    helm:
      releaseName: external-secrets
      parameters:
        - name: installCRDs
          value: "true"
        - name: resources.requests.cpu
          value: 10m
        - name: resources.requests.memory
          value: 64Mi
        - name: resources.limits.cpu
          value: 100m
        - name: resources.limits.memory
          value: 128Mi
        - name: webhook.resources.requests.cpu
          value: 10m
        - name: webhook.resources.requests.memory
          value: 32Mi
        - name: webhook.resources.limits.cpu
          value: 100m
        - name: webhook.resources.limits.memory
          value: 96Mi
        - name: certController.resources.requests.cpu
          value: 10m
        - name: certController.resources.requests.memory
          value: 32Mi
        - name: certController.resources.limits.cpu
          value: 100m
        - name: certController.resources.limits.memory
          value: 96Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.operators.externalSecrets.namespace | quote }}
  syncPolicy:
    automated:
      prune: {{ .Values.sync.automated.prune }}
      selfHeal: {{ .Values.sync.automated.selfHeal }}
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
---
{{- end }}
{{- if .Values.operators.gatewayApiCrds.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.operators.gatewayApiCrds.applicationName | quote }}
  namespace: {{ .Values.namespaces.argocd | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: {{ .Values.operators.project | quote }}
  source:
    repoURL: {{ .Values.operators.gatewayApiCrds.repoURL | quote }}
    targetRevision: {{ .Values.operators.gatewayApiCrds.targetRevision | quote }}
    path: {{ .Values.operators.gatewayApiCrds.path | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.nginxGateway | quote }}
  syncPolicy:
    automated:
      prune: {{ .Values.sync.automated.prune }}
      selfHeal: {{ .Values.sync.automated.selfHeal }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
---
{{- end }}
{{- if .Values.operators.nginxGateway.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.operators.nginxGateway.applicationName | quote }}
  namespace: {{ .Values.namespaces.argocd | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: {{ .Values.operators.project | quote }}
  source:
    repoURL: {{ .Values.operators.nginxGateway.repoURL | quote }}
    chart: {{ .Values.operators.nginxGateway.chart | quote }}
    targetRevision: {{ .Values.operators.nginxGateway.targetRevision | quote }}
    helm:
      releaseName: ngf
      parameters:
        - name: nginx.service.type
          value: LoadBalancer
        - name: nginxGateway.replicaCount
          value: "1"
        - name: nginxGateway.resources.requests.cpu
          value: 25m
        - name: nginxGateway.resources.requests.memory
          value: 96Mi
        - name: nginxGateway.resources.limits.cpu
          value: 300m
        - name: nginxGateway.resources.limits.memory
          value: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.operators.nginxGateway.namespace | quote }}
  syncPolicy:
    automated:
      prune: {{ .Values.sync.automated.prune }}
      selfHeal: {{ .Values.sync.automated.selfHeal }}
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
---
{{- end }}
{{- if .Values.operators.rabbitmq.enabled }}
