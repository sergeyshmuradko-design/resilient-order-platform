{{- /*
One Application per independently removable component. The parent prunes whole
Applications in reverse wave order; their foreground finalizers wait for the
actual resources. Chart scopes prevent multiple Applications owning one object.
Namespaces/credentials are a permanent base, not part of optional components.
*/ -}}
{{- $s := .Values.selection -}}
{{- $system := .Values.layers.platformSystem -}}
{{- $runtime := .Values.layers.platformRuntime -}}
{{- $services := .Values.layers.services -}}
{{- $apps := list
  (dict "name" $system.applicationName "layer" $system "namespace" .Values.namespaces.platform "scope" "base" "wave" -20 "enabled" true)
  (dict "name" $services.applicationName "layer" $services "namespace" .Values.namespaces.application "scope" "base" "wave" -15 "enabled" true)
  (dict "name" $runtime.applicationName "layer" $runtime "namespace" .Values.namespaces.platform "scope" "extensions" "wave" -10 "enabled" true)
  (dict "name" "resilient-orders-postgres" "layer" $runtime "namespace" .Values.namespaces.platform "scope" "postgres" "wave" -10 "enabled" $s.enable_postgres)
  (dict "name" "resilient-orders-redis" "layer" $runtime "namespace" .Values.namespaces.platform "scope" "redis" "wave" -10 "enabled" $s.enable_redis)
  (dict "name" "resilient-orders-rabbitmq-broker" "layer" $runtime "namespace" .Values.namespaces.platform "scope" "rabbitmq" "wave" -10 "enabled" $s.enable_rabbitmq_stack)
  (dict "name" "resilient-orders-rabbitmq-topology" "layer" $services "namespace" .Values.namespaces.application "scope" "rabbitmq" "wave" -5 "enabled" $s.enable_rabbitmq_stack)
  (dict "name" "resilient-orders-kyverno-policies" "layer" $system "namespace" .Values.namespaces.platform "scope" "kyverno" "wave" -15 "enabled" $s.enable_kyverno)
  (dict "name" "resilient-orders-payment-service" "layer" $services "namespace" .Values.namespaces.application "scope" "paymentService" "wave" 0 "enabled" $s.enable_payment_service)
  (dict "name" "resilient-orders-order-service" "layer" $services "namespace" .Values.namespaces.application "scope" "orderService" "wave" 10 "enabled" $s.enable_order_service)
  (dict "name" "resilient-orders-notification-service" "layer" $services "namespace" .Values.namespaces.application "scope" "notificationService" "wave" 10 "enabled" $s.enable_notification_service)
-}}
{{- range $app := $apps }}
{{- if $app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app.name | quote }}
  namespace: {{ $.Values.namespaces.argocd | quote }}
  labels:
    resilient-orders.io/root: resilient-orders-root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | quote }}
spec:
  project: {{ $app.layer.project | quote }}
  source:
    repoURL: {{ $.Values.repositoryUrl | quote }}
    targetRevision: {{ $.Values.targetRevision | quote }}
    path: {{ $app.layer.path | quote }}
    helm:
      releaseName: {{ $app.name | quote }}
      parameters:
        - name: renderScope
          value: {{ $app.scope | quote }}
        - name: secrets.external.storeName
          value: {{ $.Values.secrets.external.storeName | quote }}
        {{- if eq $app.layer.path $system.path }}
        - name: policy.kyverno.enabled
          value: {{ eq $app.scope "kyverno" | quote }}
        {{- range $key := list "hostAPI" "projectSlug" "environmentSlug" "secretsPath" "authSecretName" "authSecretNamespace" }}
        - name: {{ printf "secrets.external.infisical.%s" $key }}
          value: {{ index $.Values.secrets.external.infisical $key | quote }}
        {{- end }}
        {{- else if eq $app.layer.path $runtime.path }}
        {{- range $name := list "postgres" "redis" "rabbitmq" }}
        - name: {{ printf "components.%s.enabled" $name }}
          value: {{ eq $app.scope $name | quote }}
        {{- end }}
        {{- else if eq $app.layer.path $services.path }}
        {{- range $name := list "paymentService" "orderService" "notificationService" }}
        - name: {{ printf "components.%s.enabled" $name }}
          value: {{ eq $app.scope $name | quote }}
        {{- end }}
        - name: rabbitmqTopology.enabled
          value: {{ eq $app.scope "rabbitmq" | quote }}
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace | quote }}
  syncPolicy:
    automated:
      prune: {{ $.Values.sync.automated.prune }}
      selfHeal: {{ $.Values.sync.automated.selfHeal }}
      {{- if eq $app.scope "extensions" }}
      # Future Kafka/tracing/monitoring remain disabled by default.
      allowEmpty: true
      {{- end }}
    syncOptions:
      - PrunePropagationPolicy=foreground
      - FailOnSharedResource=true
{{- end }}
{{- end }}
