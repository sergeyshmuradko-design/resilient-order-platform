{{- if .Values.components.orderService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "order-service" "component" "backend") | nindent 4 }}
spec:
  type: {{ .Values.exposure.orderService.type }}
  ports:
    - name: http
      port: {{ .Values.components.orderService.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "order-service" "component" "backend") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: {{ .Values.labels.partOf | quote }}
    spec:
      serviceAccountName: app-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: order-service
          image: {{ .Values.components.orderService.image | quote }}
          imagePullPolicy: {{ .Values.components.orderService.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.components.orderService.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.components.orderService.javaToolOptions | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.components.orderService.springProfiles | quote }}
            - name: SERVER_PORT
              value: {{ .Values.components.orderService.port | quote }}
            - name: SPRING_CLOUD_VAULT_ENABLED
              value: "false"
            - name: MANAGEMENT_HEALTH_VAULT_ENABLED
              value: "false"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: JWT_SECRET
            - name: SECURITY_LOCAL_USERS_0_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: ORDER_SERVICE_ADMIN_USERNAME
            - name: SECURITY_LOCAL_USERS_0_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: ORDER_SERVICE_ADMIN_PASSWORD
            - name: SECURITY_LOCAL_USERS_0_ROLES_0
              value: ADMIN
            - name: SECURITY_LOCAL_USERS_1_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: ORDER_SERVICE_USER_USERNAME
            - name: SECURITY_LOCAL_USERS_1_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: ORDER_SERVICE_USER_PASSWORD
            - name: SECURITY_LOCAL_USERS_1_ROLES_0
              value: USER
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ .Values.platform.postgresHost }}:5432/{{ .Values.config.postgresDb }}?currentSchema=order_service
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-contracts-config
                  key: ORDER_SERVICE_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: ORDER_SERVICE_DB_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: {{ .Values.platform.redisHost | quote }}
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.platform.rabbitmqHost | quote }}
            - name: SPRING_RABBITMQ_DYNAMIC
              value: "false"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: ORDER_SERVICE_RABBITMQ_USERNAME
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: ORDER_SERVICE_RABBITMQ_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.components.kafka.clusterName }}-kafka-bootstrap.{{ .Values.platform.namespace }}.svc.cluster.local:9092
            - name: SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL
              value: {{ .Values.platform.schemaRegistryUrl | quote }}
            - name: SERVICES_PAYMENT_BASE_URL
              value: http://payment-service:{{ .Values.components.paymentService.port }}
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: {{ .Values.platform.jaegerOtlpHttpUrl | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          resources:
            {{- toYaml .Values.components.orderService.resources | nindent 12 }}
{{- end }}
