{{- if .Values.components.notificationService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "notification-service" "component" "backend") | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.components.notificationService.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "notification-service" "component" "backend") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: {{ .Values.labels.partOf | quote }}
    spec:
      serviceAccountName: app-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: notification-service
          image: {{ .Values.components.notificationService.image | quote }}
          imagePullPolicy: {{ .Values.components.notificationService.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.components.notificationService.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.components.notificationService.javaToolOptions | quote }}
            - name: SERVER_PORT
              value: {{ .Values.components.notificationService.port | quote }}
            - name: SPRING_CLOUD_VAULT_ENABLED
              value: "false"
            - name: MANAGEMENT_HEALTH_VAULT_ENABLED
              value: "false"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ .Values.platform.postgresHost }}:5432/{{ .Values.config.postgresDb }}?currentSchema=notification_service
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-contracts-config
                  key: NOTIFICATION_SERVICE_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: NOTIFICATION_SERVICE_DB_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.platform.rabbitmqHost | quote }}
            - name: SPRING_RABBITMQ_DYNAMIC
              value: "false"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: NOTIFICATION_SERVICE_RABBITMQ_USERNAME
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime.targetName }}
                  key: NOTIFICATION_SERVICE_RABBITMQ_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.components.kafka.clusterName }}-kafka-bootstrap.{{ .Values.platform.namespace }}.svc.cluster.local:9092
            - name: SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL
              value: {{ .Values.platform.schemaRegistryUrl | quote }}
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: {{ .Values.platform.jaegerOtlpHttpUrl | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          resources:
            {{- toYaml .Values.components.notificationService.resources | nindent 12 }}
{{- end }}
