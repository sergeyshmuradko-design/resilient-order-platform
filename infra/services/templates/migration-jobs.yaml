{{- if .Values.migrations.enabled }}
{{- range .Values.migrations.services }}
{{- if .enabled }}
{{- $image := "" }}
{{- if eq .imageKey "orderService" }}
{{- $image = $.Values.components.orderService.migrationImage }}
{{- else if eq .imageKey "notificationService" }}
{{- $image = $.Values.components.notificationService.migrationImage }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate" .name | quote }}
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" $ "name" .name "component" "migration") | nindent 4 }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: {{ $.Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name | quote }}
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: {{ $.Values.labels.partOf | quote }}
    spec:
      restartPolicy: Never
      serviceAccountName: app-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: flyway
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - -url=jdbc:postgresql://{{ $.Values.platform.postgresHost }}:5432/{{ $.Values.config.postgresDb }}
            - -user=$(FLYWAY_USER)
            - -password=$(FLYWAY_PASSWORD)
            - -schemas={{ .schema }}
            - -defaultSchema={{ .schema }}
            - -connectRetries={{ $.Values.migrations.connectRetries }}
            - migrate
          env:
            - name: FLYWAY_USER
              valueFrom:
                configMapKeyRef:
                  name: app-contracts-config
                  key: {{ .ownerUserConfigKey }}
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.migration.targetName }}
                  key: {{ .ownerPasswordSecretKey }}
---
{{- end }}
{{- end }}
{{- end }}
