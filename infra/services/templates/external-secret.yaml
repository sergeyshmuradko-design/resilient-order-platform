# Application namespace copies of reviewed secrets.
#
# Application Pods do not read Secrets from the platform namespace. ESO copies
# only the reviewed Infisical keys into this namespace. Runtime Pods and
# migration Jobs intentionally receive different Secrets: app containers get
# only runtime credentials, while Flyway Jobs get database owner credentials.
{{- $root := . -}}
{{- range $groupName, $group := dict "runtime" .Values.secrets.runtime "migration" .Values.secrets.migration }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $group.targetName | quote }}
  labels:
    {{- include "resilient-orders.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.secrets.external.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $root.Values.secrets.external.storeName }}
  target:
    name: {{ $group.targetName | quote }}
    creationPolicy: Owner
  data:
    {{- range $group.keys }}
    - secretKey: {{ . | quote }}
      remoteRef:
        key: {{ . | quote }}
    {{- end }}
{{- end }}
