# Application namespace copy of runtime secrets.
#
# Application Pods do not read Secrets from the platform namespace. ESO copies
# only the reviewed Infisical keys into this namespace as platform-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-secrets
  labels:
    {{- include "resilient-orders.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.external.storeName }}
  target:
    name: {{ .Values.secrets.targetName }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.external.keys }}
    - secretKey: {{ . | quote }}
      remoteRef:
        key: {{ . | quote }}
    {{- end }}
