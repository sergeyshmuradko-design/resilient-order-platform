# Local Gateway API profile.
#
# A single Gateway data-plane port replaces several per-service LoadBalancer
# ports. In k3d, publish one host port to the controller, for example:
#   k3d cluster create resilient-orders --port '8080:80@loadbalancer' ...
gateway:
  enabled: true
  name: platform-gateway
  className: nginx
  hostname: "*.localhost"

routes:
  enabled: true
  gatewayName: platform-gateway
  hosts:
    orderService: order.localhost

exposure:
  orderService:
    type: ClusterIP
    port: 8081
  prometheus:
    type: ClusterIP
    port: 9090
  grafana:
    type: ClusterIP
    port: 3000
