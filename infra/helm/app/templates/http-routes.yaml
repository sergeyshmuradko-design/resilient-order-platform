{{- if .Values.routes.enabled }}
{{- if .Values.components.orderService.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "order-service" "component" "backend") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.routes.gatewayName | quote }}
      namespace: {{ .Values.routes.gatewayNamespace | quote }}
  hostnames:
    - {{ .Values.routes.hosts.orderService | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: order-service
          port: {{ .Values.exposure.orderService.port }}
{{- end }}
{{- end }}
