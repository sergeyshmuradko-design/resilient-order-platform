# Default values are intentionally small. The project is a demo/learning stack
# for a few manual requests, not a continuously loaded production cluster.

nameOverride: ""
fullnameOverride: ""

labels:
  partOf: resilient-order-platform

imagePullSecrets: []

platform:
  namespace: resilient-orders-platform
  postgresHost: postgres.resilient-orders-platform.svc.cluster.local
  rabbitmqHost: rabbitmq.resilient-orders-platform.svc.cluster.local
  redisHost: redis.resilient-orders-platform.svc.cluster.local
  schemaRegistryUrl: http://schema-registry.resilient-orders-platform.svc.cluster.local:8081
  jaegerOtlpHttpUrl: http://jaeger.resilient-orders-platform.svc.cluster.local:4318/v1/traces

guardrails:
  enabled: true
  quota:
    requestsCpu: 1000m
    requestsMemory: 2Gi
    limitsCpu: 4000m
    limitsMemory: 4Gi
    requestsStorage: 3Gi
    persistentVolumeClaims: "8"
    pods: "32"
  limitRange:
    defaultRequestCpu: 25m
    defaultRequestMemory: 64Mi
    defaultCpu: 250m
    defaultMemory: 256Mi
    maxCpu: 750m
    maxMemory: 512Mi

config:
  postgresDb: orders_db
  postgresUser: orders_user
  postgresExporterUser: postgres_exporter
  orderServiceDbOwnerUser: order_service_owner
  orderServiceDbUser: order_service_app
  notificationServiceDbOwnerUser: notification_service_owner
  notificationServiceDbUser: notification_service_app
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"

exposure:
  # Default keeps Services internal. Browser/API access is handled by Gateway API
  # in local/prod-like profiles instead of exposing many LoadBalancer Services.
  orderService:
    type: ClusterIP
    port: 8081
  prometheus:
    type: ClusterIP
    port: 9090
  grafana:
    type: ClusterIP
    port: 3000

routes:
  enabled: false
  gatewayName: platform-gateway
  gatewayNamespace: resilient-orders-platform
  hosts:
    paymentService: payment.localhost
    orderService: order.localhost
    notificationService: notification.localhost

secrets:
  # The app namespace receives its own platform-secrets Secret from the same
  # Vault-backed ClusterSecretStore. This lets application Pods read only the
  # Secret in their namespace instead of accessing platform namespace Secrets.
  targetName: platform-secrets
  external:
    refreshInterval: 1m
    storeName: vault-cluster-store
    secretKey: resilient-orders

components:
  postgres:
    enabled: false
    image: postgres:16
    storage: 512Mi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  redis:
    enabled: false
    image: redis:7
    maxmemory: 32mb
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  rabbitmq:
    enabled: false
    image: rabbitmq:3-management
    storage: 512Mi
    messageTtlMs: 300000
    maxQueueLength: 1000
    diskFreeLimitBytes: "134217728"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  kafka:
    enabled: true
    # Kafka is managed by Strimzi. This keeps Kafka lifecycle, listeners,
    # KRaft metadata, broker identity, topic management and generated Services
    # in the operator instead of hand-written Deployment environment variables.
    clusterName: resilient-kafka
    nodePoolName: dual-role
    version: 4.3.0
    metadataVersion: 4.3-IV0
    replicas: 1
    storage: 512Mi
    deleteClaim: true
    heap:
      xms: 128m
      xmx: 256m
    logRetentionMs: "120000"
    logRetentionBytes: "67108864"
    logSegmentBytes: "16777216"
    resources:
      requests:
        cpu: 100m
        memory: 320Mi
      limits:
        cpu: 500m
        memory: 512Mi
    topics:
      - name: order.created.events
        partitions: 1
        replicas: 1
        config:
          retention.ms: "300000"
          segment.bytes: "8388608"
          cleanup.policy: delete
      - name: order.created.events.avro
        partitions: 1
        replicas: 1
        config:
          retention.ms: "300000"
          segment.bytes: "8388608"
          cleanup.policy: delete
      - name: order.created.events.DLT
        partitions: 1
        replicas: 1
        config:
          retention.ms: "300000"
          segment.bytes: "8388608"
          cleanup.policy: delete
  schemaRegistry:
    enabled: false
    image: confluentinc/cp-schema-registry:8.3.0
    heapOpts: -Xms64m -Xmx128m
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 300m
        memory: 256Mi
  paymentService:
    enabled: true
    image: resilient-orders/payment-service:local
    imagePullPolicy: IfNotPresent
    port: 8082
    javaToolOptions: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=30
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  orderService:
    enabled: true
    image: resilient-orders/order-service:local
    migrationImage: resilient-orders/order-service-migrations:local
    imagePullPolicy: IfNotPresent
    port: 8081
    springProfiles: docker
    flywayEnabled: true
    javaToolOptions: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=30
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 384Mi
  notificationService:
    enabled: true
    image: resilient-orders/notification-service:local
    migrationImage: resilient-orders/notification-service-migrations:local
    imagePullPolicy: IfNotPresent
    port: 8083
    flywayEnabled: true
    javaToolOptions: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=30
    resources:
      requests:
        cpu: 40m
        memory: 160Mi
      limits:
        cpu: 400m
        memory: 320Mi

observability:
  tracing:
    enabled: true
    image: jaegertracing/all-in-one:1.60
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  monitoring:
    enabled: false
    postgresExporter:
      image: prometheuscommunity/postgres-exporter:v0.20.1
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          cpu: 100m
          memory: 128Mi
    prometheus:
      image: prom/prometheus
      retentionTime: 30m
      retentionSize: 256MB
      emptyDirSizeLimit: 256Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    grafana:
      image: grafana/grafana
      emptyDirSizeLimit: 128Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi

migrations:
  enabled: false
  ttlSecondsAfterFinished: 300
  connectRetries: 60
  services:
    - name: order-service
      enabled: true
      imageKey: orderService
      schema: order_service
      ownerUserConfigKey: ORDER_SERVICE_DB_OWNER_USER
      ownerPasswordSecretKey: ORDER_SERVICE_DB_OWNER_PASSWORD
    - name: notification-service
      enabled: true
      imageKey: notificationService
      schema: notification_service
      ownerUserConfigKey: NOTIFICATION_SERVICE_DB_OWNER_USER
      ownerPasswordSecretKey: NOTIFICATION_SERVICE_DB_OWNER_PASSWORD
