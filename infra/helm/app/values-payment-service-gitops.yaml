# GitOps deployment profile for the first service CI/CD slice.
#
# Git declares that payment-service should exist and which registry image it
# follows. GitHub Actions publishes :main and immutable SHA tags. Argo CD Image
# Updater tracks the :main digest and updates the live Argo CD Application
# without committing image changes back into this repository.

components:
  paymentService:
    enabled: true
    image: ghcr.io/sergeyshmuradko-design/resilient-order-platform/payment-service:main
    imagePullPolicy: Always
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  orderService:
    enabled: false
  notificationService:
    enabled: false
  kafka:
    enabled: false
  schemaRegistry:
    enabled: false

routes:
  enabled: true
  hosts:
    paymentService: payment.localhost

observability:
  tracing:
    enabled: false
  monitoring:
    enabled: false
