# Load-test profile.
#
# Keep only the services needed for Gatling HTTP experiments. Grafana and
# Prometheus can be layered on top with values-observability-monitoring.yaml.
components:
  orderService:
    springProfiles: docker,load-test
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 384Mi
