# Prometheus server configuration for the lightweight Helm monitoring profile.
#
# Prometheus runs inside Kubernetes, so targets use Kubernetes Service DNS names
# instead of Docker Compose service names or localhost.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "postgresql"
    static_configs:
      - targets:
          - "postgres-exporter:9187"

  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "order-service:8081"

  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "payment-service:8082"

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "notification-service:8083"

