{{- if .Values.observability.monitoring.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "postgres-exporter" "component" "monitoring") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: {{ .Values.labels.partOf | quote }}
    spec:
      serviceAccountName: platform-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres-exporter
          image: {{ .Values.observability.monitoring.postgresExporter.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - "--collector.database_wraparound"
            - "--collector.long_running_transactions"
            - "--collector.stat_activity_autovacuum"
            - "--collector.stat_statements"
            - "--collector.stat_statements.include_query"
            - "--collector.stat_statements.query_length=200"
            - "--collector.statio_user_indexes"
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_DB
            - name: POSTGRES_EXPORTER_USER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_EXPORTER_USER
            - name: POSTGRES_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.targetName }}
                  key: POSTGRES_EXPORTER_PASSWORD
            - name: DATA_SOURCE_NAME
              value: postgresql://$(POSTGRES_EXPORTER_USER):$(POSTGRES_EXPORTER_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.observability.monitoring.postgresExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "postgres-exporter" "component" "monitoring") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "prometheus" "component" "monitoring") | nindent 4 }}
data:
  prometheus.yml: |
{{ .Files.Get "files/prometheus/prometheus.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "prometheus" "component" "monitoring") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: {{ .Values.labels.partOf | quote }}
    spec:
      serviceAccountName: platform-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: prometheus
          image: {{ .Values.observability.monitoring.prometheus.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.observability.monitoring.prometheus.retentionTime }}"
            - "--storage.tsdb.retention.size={{ .Values.observability.monitoring.prometheus.retentionSize }}"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.observability.monitoring.prometheus.resources | nindent 12 }}
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir:
            sizeLimit: {{ .Values.observability.monitoring.prometheus.emptyDirSizeLimit | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "prometheus" "component" "monitoring") | nindent 4 }}
spec:
  type: {{ .Values.exposure.prometheus.type }}
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: {{ .Values.exposure.prometheus.port }}
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "grafana" "component" "monitoring") | nindent 4 }}
data:
  prometheus.yml: |
{{ .Files.Get "files/grafana/provisioning/datasources/prometheus.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "grafana" "component" "monitoring") | nindent 4 }}
data:
  dashboards.yml: |
{{ .Files.Get "files/grafana/provisioning/dashboards/dashboards.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "grafana" "component" "monitoring") | nindent 4 }}
data:
  01-system-overview.json: |
{{ .Files.Get "files/grafana/dashboards/01-system-overview.json" | indent 4 }}
  02-application-jvm.json: |
{{ .Files.Get "files/grafana/dashboards/02-application-jvm.json" | indent 4 }}
  03-postgresql-overview.json: |
{{ .Files.Get "files/grafana/dashboards/03-postgresql-overview.json" | indent 4 }}
  04-postgresql-details.json: |
{{ .Files.Get "files/grafana/dashboards/04-postgresql-details.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "grafana" "component" "monitoring") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: {{ .Values.labels.partOf | quote }}
    spec:
      serviceAccountName: platform-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: grafana
          image: {{ .Values.observability.monitoring.grafana.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.targetName }}
                  key: GRAFANA_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.targetName }}
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: grafana-provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: grafana-data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.observability.monitoring.grafana.resources | nindent 12 }}
      volumes:
        - name: grafana-provisioning-datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: grafana-provisioning-dashboards
          configMap:
            name: grafana-provisioning-dashboards
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-data
          emptyDir:
            sizeLimit: {{ .Values.observability.monitoring.grafana.emptyDirSizeLimit | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "grafana" "component" "monitoring") | nindent 4 }}
spec:
  type: {{ .Values.exposure.grafana.type }}
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: {{ .Values.exposure.grafana.port }}
      targetPort: http
{{- end }}
