# Vault-backed External Secrets source.
#
# Local mode:
# - `make helm-vault-token-source` creates only the Vault bootstrap token Secret.
# - `make helm-vault-seed` writes application secrets from .env into Vault KV v2.
# - ESO reads from Vault and materializes platform-secrets in Kubernetes.
#
# Cloud mode:
# Replace the provider.vault block below with a cloud provider block, for
# example OCI Vault / AWS Secrets Manager / GCP Secret Manager. Keep the
# ExternalSecret target name and workload env references unchanged.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secrets.external.storeName }}
spec:
  provider:
    vault:
      server: {{ .Values.secrets.external.vaultServer | quote }}
      path: {{ .Values.secrets.external.vaultMountPath | quote }}
      version: v2
      auth:
        tokenSecretRef:
          name: {{ .Values.secrets.external.vaultTokenSecretName }}
          namespace: {{ .Values.secrets.external.operatorNamespace }}
          key: {{ .Values.secrets.external.vaultTokenSecretKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-secrets
  labels:
    {{- include "resilient-orders.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.external.storeName }}
  target:
    name: {{ .Values.secrets.targetName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.external.secretKey }}
