{{- if .Values.components.rabbitmq.enabled }}
# RabbitMQ definitions generated by External Secrets Operator.
#
# The topology is source-controlled, but passwords are read from the same local
# source Secret as platform-secrets. This avoids committing runtime passwords in
# definitions.json while preserving the "apps do not auto-declare topology"
# design.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-definitions
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "rabbitmq" "component" "messaging") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.external.storeName }}
  target:
    name: rabbitmq-definitions
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        definitions.json: |
{{ tpl (.Files.Get "files/rabbitmq/definitions.json.tpl") . | indent 10 }}
  data:
    {{- range .Values.rabbitmqTopology.users }}
    - secretKey: {{ .usernameSecretKey }}
      remoteRef:
        key: {{ $.Values.secrets.external.secretKey }}
        property: {{ .usernameSecretKey }}
    - secretKey: {{ .passwordSecretKey }}
      remoteRef:
        key: {{ $.Values.secrets.external.secretKey }}
        property: {{ .passwordSecretKey }}
    {{- end }}
{{- end }}
