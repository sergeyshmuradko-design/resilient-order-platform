# GitOps bootstrap profile.
#
# This is the first small slice that Argo CD reconciles while the project is
# moving from Docker Compose to Kubernetes. It keeps Vault, PostgreSQL, Redis
# and RabbitMQ inside the cluster while Kafka, observability and application
# workloads stay disabled for now.

guardrails:
  quota:
    requestsCpu: 500m
    requestsMemory: 768Mi
    limitsCpu: 1500m
    limitsMemory: 1536Mi
    requestsStorage: 1Gi
    persistentVolumeClaims: "2"
    pods: "10"
  limitRange:
    defaultRequestCpu: 10m
    defaultRequestMemory: 32Mi
    defaultCpu: 150m
    defaultMemory: 192Mi
    maxCpu: 500m
    maxMemory: 512Mi

database:
  provisioner:
    enabled: false

gateway:
  enabled: true
  routes:
    argocd:
      enabled: true

components:
  vault:
    enabled: true
  postgres:
    enabled: true
    storage: 256Mi
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 192Mi
  redis:
    enabled: true
    maxmemory: 16mb
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  rabbitmq:
    enabled: true
    storage: 256Mi
    diskFreeLimitBytes: "67108864"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  kafka:
    enabled: false
  schemaRegistry:
    enabled: false

observability:
  tracing:
    enabled: false
  monitoring:
    enabled: false
