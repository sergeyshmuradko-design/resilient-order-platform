# Default values are intentionally small. The project is a demo/learning stack
# for a few manual requests, not a continuously loaded production cluster.

nameOverride: ""
fullnameOverride: ""

labels:
  partOf: resilient-order-platform

namespaces:
  platform: resilient-orders-platform
  application: resilient-orders
  gatewayRoutesLabelKey: resilient-orders.io/gateway-routes
  gatewayRoutesLabelValue: allowed

guardrails:
  enabled: true
  quota:
    requestsCpu: 1000m
    requestsMemory: 2Gi
    limitsCpu: 4000m
    limitsMemory: 4Gi
    requestsStorage: 3Gi
    persistentVolumeClaims: "8"
    pods: "32"
  limitRange:
    defaultRequestCpu: 25m
    defaultRequestMemory: 64Mi
    defaultCpu: 250m
    defaultMemory: 256Mi
    maxCpu: 750m
    maxMemory: 512Mi

config:
  postgresDb: orders_db
  postgresUser: orders_user
  postgresExporterUser: postgres_exporter
  orderServiceDbOwnerUser: order_service_owner
  orderServiceDbUser: order_service_app
  notificationServiceDbOwnerUser: notification_service_owner
  notificationServiceDbUser: notification_service_app
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"

external:
  postgresHost: postgres

database:
  provisioner:
    enabled: false
    image: postgres:16
  # Platform-owned declaration of service database contracts.
  #
  # Adding a new service should require adding one item here and providing the
  # matching password keys through the configured secret source. The Postgres
  # bootstrap script is generated from this list, so platform SQL does not need
  # service-specific copy/paste changes.
  services:
    - name: order-service
      schema: order_service
      ownerRole:
        configKey: ORDER_SERVICE_DB_OWNER_USER
        value: order_service_owner
        passwordSecretKey: ORDER_SERVICE_DB_OWNER_PASSWORD
      appRole:
        configKey: ORDER_SERVICE_DB_USER
        value: order_service_app
        passwordSecretKey: ORDER_SERVICE_DB_PASSWORD
    - name: notification-service
      schema: notification_service
      ownerRole:
        configKey: NOTIFICATION_SERVICE_DB_OWNER_USER
        value: notification_service_owner
        passwordSecretKey: NOTIFICATION_SERVICE_DB_OWNER_PASSWORD
      appRole:
        configKey: NOTIFICATION_SERVICE_DB_USER
        value: notification_service_app
        passwordSecretKey: NOTIFICATION_SERVICE_DB_PASSWORD

exposure:
  # Default keeps Services internal. Browser/API access is handled by Gateway API
  # in local/prod-like profiles instead of exposing many LoadBalancer Services.
  orderService:
    type: ClusterIP
    port: 8081
  prometheus:
    type: ClusterIP
    port: 9090
  grafana:
    type: ClusterIP
    port: 3000

gateway:
  enabled: false
  name: platform-gateway
  className: nginx
  hostname: "*.localhost"
  hosts:
    grafana: grafana.localhost
    prometheus: prometheus.localhost
  allowedRoutes:
    namespaces:
      from: Selector

secrets:
  # platform-secrets is produced by External Secrets Operator from Vault.
  # For cloud migration, replace only the SecretStore provider block in
  # templates/external-secrets-vault-source.yaml with OCI/AWS/GCP provider
  # settings. Workloads can keep the same platform-secrets references.
  targetName: platform-secrets
  external:
    refreshInterval: 1m
    storeName: vault-cluster-store
    vaultServer: http://vault.resilient-orders-platform.svc.cluster.local:8200
    vaultMountPath: secret
    secretKey: resilient-orders
    vaultTokenSecretName: vault-token
    vaultTokenSecretKey: token
    operatorNamespace: external-secrets
    operatorServiceAccount: external-secrets

components:
  vault:
    enabled: true
    image: hashicorp/vault:1.17
    devTokenSecretName: vault-dev-token
    devTokenSecretKey: token
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 192Mi
  postgres:
    enabled: true
    image: postgres:16
    storage: 512Mi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  redis:
    enabled: true
    image: redis:7
    maxmemory: 32mb
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management
    storage: 512Mi
    messageTtlMs: 300000
    maxQueueLength: 1000
    diskFreeLimitBytes: "134217728"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  kafka:
    enabled: true
    # Kafka is managed by Strimzi. This keeps Kafka lifecycle, listeners,
    # KRaft metadata, broker identity and generated Services in the operator
    # instead of hand-written Deployment environment variables.
    clusterName: resilient-kafka
    nodePoolName: dual-role
    version: 4.3.0
    metadataVersion: 4.3-IV0
    replicas: 1
    storage: 512Mi
    deleteClaim: true
    heap:
      xms: 128m
      xmx: 256m
    logRetentionMs: "120000"
    logRetentionBytes: "67108864"
    logSegmentBytes: "16777216"
    resources:
      requests:
        cpu: 100m
        memory: 320Mi
      limits:
        cpu: 500m
        memory: 512Mi
  schemaRegistry:
    enabled: true
    image: confluentinc/cp-schema-registry:8.3.0
    heapOpts: -Xms64m -Xmx128m
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 300m
        memory: 256Mi

rabbitmqTopology:
  vhosts:
    - name: /
  users:
    - usernameSecretKey: RABBITMQ_ADMIN_USERNAME
      passwordSecretKey: RABBITMQ_ADMIN_PASSWORD
      tags: administrator
    - usernameSecretKey: ORDER_SERVICE_RABBITMQ_USERNAME
      passwordSecretKey: ORDER_SERVICE_RABBITMQ_PASSWORD
      tags: ""
    - usernameSecretKey: NOTIFICATION_SERVICE_RABBITMQ_USERNAME
      passwordSecretKey: NOTIFICATION_SERVICE_RABBITMQ_PASSWORD
      tags: ""
  permissions:
    - userSecretKey: RABBITMQ_ADMIN_USERNAME
      vhost: /
      configure: ".*"
      write: ".*"
      read: ".*"
    - userSecretKey: ORDER_SERVICE_RABBITMQ_USERNAME
      vhost: /
      configure: "^$"
      write: "^order\\.exchange$"
      read: "^$"
    - userSecretKey: NOTIFICATION_SERVICE_RABBITMQ_USERNAME
      vhost: /
      configure: "^$"
      write: "^$"
      read: "^order\\.created\\.queue$"
  exchanges:
    - name: order.exchange
      vhost: /
      type: direct
      durable: true
      autoDelete: false
      internal: false
      arguments: {}
    - name: order.dlx
      vhost: /
      type: direct
      durable: true
      autoDelete: false
      internal: false
      arguments: {}
  queues:
    - name: order.created.queue
      vhost: /
      durable: true
      autoDelete: false
      arguments:
        x-dead-letter-exchange: order.dlx
        x-dead-letter-routing-key: order.created.dlq
        x-message-ttl: 300000
        x-max-length: 1000
    - name: order.created.dlx
      vhost: /
      durable: true
      autoDelete: false
      arguments:
        x-message-ttl: 300000
        x-max-length: 1000
  bindings:
    - source: order.exchange
      vhost: /
      destination: order.created.queue
      destinationType: queue
      routingKey: order.created
      arguments: {}
    - source: order.dlx
      vhost: /
      destination: order.created.dlx
      destinationType: queue
      routingKey: order.created.dlq
      arguments: {}
  policies: []

observability:
  tracing:
    enabled: true
    image: jaegertracing/all-in-one:1.60
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  monitoring:
    enabled: false
    postgresExporter:
      image: prometheuscommunity/postgres-exporter:v0.20.1
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          cpu: 100m
          memory: 128Mi
    prometheus:
      image: prom/prometheus
      retentionTime: 30m
      retentionSize: 256MB
      emptyDirSizeLimit: 256Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    grafana:
      image: grafana/grafana
      emptyDirSizeLimit: 128Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
