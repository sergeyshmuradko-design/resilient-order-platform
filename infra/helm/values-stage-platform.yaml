# Stage profile: platform dependencies only.
#
# This is used by `make helm-platform` to reconcile shared infrastructure first.
# Later stages enable Schema Registry, application Deployments and observability
# with `--reuse-values`.
components:
  schemaRegistry:
    enabled: false
  paymentService:
    enabled: false
  orderService:
    enabled: false
  notificationService:
    enabled: false

observability:
  tracing:
    enabled: false
  monitoring:
    enabled: false
