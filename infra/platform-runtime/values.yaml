# Platform-runtime is the shared runtime infrastructure layer owned by
# platform/SRE maintainers. It runs stateful dependencies such as PostgreSQL,
# Redis and RabbitMQ, plus optional Kafka, tracing and monitoring components.
#
# Defaults stay intentionally small because the local Codespaces cluster is used
# for a few manual checks, not for continuous production traffic.

nameOverride: ""
fullnameOverride: ""

labels:
  # Kubernetes recommended "app.kubernetes.io/part-of" value. It lets Argo CD,
  # kubectl and observability tools group every resource by the same product.
  partOf: resilient-order-platform

platform:
  serviceAccount:
    enabled: false
  config:
    enabled: false
  appContracts:
    enabled: false

namespaces:
  platform: resilient-orders-platform
  application: resilient-orders
  gatewayRoutesLabelKey: resilient-orders.io/gateway-routes
  gatewayRoutesLabelValue: allowed

guardrails:
  enabled: false
  quota:
    requestsCpu: 1000m
    requestsMemory: 2Gi
    limitsCpu: 4000m
    limitsMemory: 4Gi
    requestsStorage: 3Gi
    persistentVolumeClaims: "8"
    pods: "32"
  limitRange:
    defaultRequestCpu: 25m
    defaultRequestMemory: 64Mi
    defaultCpu: 250m
    defaultMemory: 256Mi
    maxCpu: 750m
    maxMemory: 512Mi

config:
  postgresDb: orders_db
  postgresUser: orders_user
  postgresExporterUser: postgres_exporter
  orderServiceDbOwnerUser: order_service_owner
  orderServiceDbUser: order_service_app
  notificationServiceDbOwnerUser: notification_service_owner
  notificationServiceDbUser: notification_service_app
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"

external:
  postgresHost: postgres

database:
  provisioner:
    enabled: false
    image: postgres:16
  # Same reviewed service database contract list as platform-system.
  #
  # The runtime chart owns the privileged Job that applies those contracts to
  # PostgreSQL. Service owners can request new schemas/roles through Git, but
  # cannot grant themselves extra database permissions at runtime.
  services:
    - name: order-service
      schema: order_service
      ownerRole:
        configKey: ORDER_SERVICE_DB_OWNER_USER
        value: order_service_owner
        passwordSecretKey: ORDER_SERVICE_DB_OWNER_PASSWORD
      appRole:
        configKey: ORDER_SERVICE_DB_USER
        value: order_service_app
        passwordSecretKey: ORDER_SERVICE_DB_PASSWORD
    - name: notification-service
      schema: notification_service
      ownerRole:
        configKey: NOTIFICATION_SERVICE_DB_OWNER_USER
        value: notification_service_owner
        passwordSecretKey: NOTIFICATION_SERVICE_DB_OWNER_PASSWORD
      appRole:
        configKey: NOTIFICATION_SERVICE_DB_USER
        value: notification_service_app
        passwordSecretKey: NOTIFICATION_SERVICE_DB_PASSWORD

exposure:
  # Default keeps Services internal. Browser/API access is handled by Gateway API
  # in local/prod-like profiles instead of exposing many LoadBalancer Services.
  orderService:
    type: ClusterIP
    port: 8081
  prometheus:
    type: ClusterIP
    port: 9090
  grafana:
    type: ClusterIP
    port: 3000

gateway:
  enabled: false
  name: platform-gateway
  className: nginx
  hostname: "*.localhost"
  hosts:
    argocd: argocd.localhost
    grafana: grafana.localhost
    prometheus: prometheus.localhost
  routes:
    argocd:
      enabled: false
  allowedRoutes:
    namespaces:
      from: Selector

secrets:
  # platform-secrets is produced by External Secrets Operator from Infisical in the
  # platform-system chart. Runtime workloads only consume this Secret.
  targetName: platform-secrets
  external:
    enabled: false
    refreshInterval: 1m
    storeName: infisical-cluster-store
    operatorServiceAccount: external-secrets

components:
  postgres:
    enabled: true
    image: postgres:16
    storage: 256Mi
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 192Mi
  redis:
    enabled: true
    image: redis:7
    maxmemory: 16mb
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  rabbitmq:
    enabled: true
    clusterName: rabbitmq
    image: rabbitmq:3.13-management
    storage: 256Mi
    messageTtlMs: 300000
    maxQueueLength: 1000
    diskFreeLimitBytes: "67108864"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  kafka:
    enabled: false
    # Kafka is managed by Strimzi. This keeps Kafka lifecycle, listeners,
    # KRaft metadata, broker identity and generated Services in the operator
    # instead of hand-written Deployment environment variables.
    clusterName: resilient-kafka
    nodePoolName: dual-role
    version: 4.3.0
    metadataVersion: 4.3-IV0
    replicas: 1
    storage: 512Mi
    deleteClaim: true
    heap:
      xms: 128m
      xmx: 256m
    logRetentionMs: "120000"
    logRetentionBytes: "67108864"
    logSegmentBytes: "16777216"
    resources:
      requests:
        cpu: 100m
        memory: 320Mi
      limits:
        cpu: 500m
        memory: 512Mi
  schemaRegistry:
    enabled: false
    image: confluentinc/cp-schema-registry:8.3.0
    heapOpts: -Xms64m -Xmx128m
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 300m
        memory: 256Mi

observability:
  tracing:
    enabled: false
    image: jaegertracing/all-in-one:1.60
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  monitoring:
    enabled: false
    postgresExporter:
      image: prometheuscommunity/postgres-exporter:v0.20.1
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          cpu: 100m
          memory: 128Mi
    prometheus:
      image: prom/prometheus
      retentionTime: 30m
      retentionSize: 256MB
      emptyDirSizeLimit: 256Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    grafana:
      image: grafana/grafana
      emptyDirSizeLimit: 128Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
