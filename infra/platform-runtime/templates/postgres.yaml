{{- if .Values.components.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  # StatefulSet uses this headless Service for stable pod DNS names such as
  # postgres-0.postgres.<namespace>.svc.cluster.local. With one PostgreSQL pod,
  # clients can still use the shorter postgres:5432 Service name.
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: {{ .Values.labels.partOf | quote }}
    spec:
      serviceAccountName: platform-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres
          image: {{ .Values.components.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            # pg_stat_statements must be enabled at process startup.
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - track_io_timing=on
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.targetName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_EXPORTER_USER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_EXPORTER_USER
            - name: POSTGRES_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.targetName }}
                  key: POSTGRES_EXPORTER_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
          startupProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.components.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.components.postgres.storage | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  labels:
    {{- include "resilient-orders.componentLabels" (dict "root" . "name" "postgres" "component" "database") | nindent 4 }}
data:
  01-bootstrap-database.sh: |
{{ .Files.Get "files/postgres/01-bootstrap-database.sh" | indent 4 }}
{{- end }}
